<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Online coaching session on a laptop -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8cfc1"/><stop offset="1" stop-color="#b9ab95"/></linearGradient>
    <linearGradient id="callbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7eef0"/><stop offset="1" stop-color="#cfdadd"/></linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#room)"/>
  <!-- window light and plant in the background -->
  <rect x="440" y="30" width="170" height="250" fill="#ece6da" opacity=".7"/>
  <path d="M520 280l-10-60h52l-10 60z" fill="#8a7a63"/>
  <g fill="#7d8f6a"><path d="M534 222c-20-40-46-60-72-62 16 26 40 50 68 66z"/><path d="M540 220c4-40 20-70 46-86-6 34-20 64-42 88z"/></g>
  <!-- desk -->
  <rect y="380" width="640" height="100" fill="#b89f7e"/>
  <rect y="380" width="640" height="8" fill="#a08867"/>
  <!-- laptop -->
  <path d="M120 386h360l30 26H90z" fill="#9a958c"/>
  <rect x="140" y="120" width="320" height="250" rx="10" fill="#3c3a37"/>
  <rect x="154" y="134" width="292" height="210" rx="4" fill="url(#callbg)"/>
  <rect x="140" y="360" width="320" height="26" fill="#55514a"/>
  <!-- person on the call -->
  <rect x="154" y="134" width="292" height="210" rx="4" fill="none"/>
  <path d="M220 344c4-60 40-92 80-92s76 32 80 92z" fill="#f3efe7"/>
  <path d="M276 262l24 30 24-30" fill="none" stroke="#d6cfc2" stroke-width="4"/>
  <rect x="288" y="226" width="24" height="30" rx="10" fill="#e2b896"/>
  <circle cx="300" cy="206" r="34" fill="#e2b896"/>
  <path d="M264 212c-8-48 26-70 56-62 28 8 38 36 30 64-6-24-20-38-40-40-16 12-30 26-46 38z" fill="#a0703f"/>
  <path d="M266 206c-6 30 0 56 14 70l-14 2c-14-20-16-48 0-72z" fill="#a0703f"/>
  <path d="M290 220c4 4 16 4 20 0" stroke="#9a6e4f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- self view -->
  <rect x="370" y="146" width="64" height="48" rx="6" fill="#8a8174"/>
  <circle cx="402" cy="166" r="10" fill="#c99a74"/><path d="M386 194c2-12 8-18 16-18s14 6 16 18z" fill="#c79e30"/>
  <!-- call controls -->
  <g transform="translate(300 322)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#3c3a37" opacity=".85"/>
    <circle cx="-40" r="9" fill="#fbf8f1"/><circle cx="0" r="9" fill="#fbf8f1"/><circle cx="40" r="9" fill="#d9534f"/>
    <rect x="-43" y="-5" width="6" height="8" rx="3" fill="#3c3a37"/>
    <rect x="-5" y="-4" width="8" height="8" rx="1" fill="#3c3a37"/><path d="M3 -2l4-2v8l-4-2z" fill="#3c3a37"/>
  </g>
  <!-- coffee mug and notebook -->
  <rect x="520" y="336" width="46" height="50" rx="6" fill="#fbf8f1"/>
  <path d="M566 348c18 0 18 24 0 24" fill="none" stroke="#fbf8f1" stroke-width="7"/>
  <rect x="20" y="370" width="80" height="12" rx="2" fill="#c79e30"/>
  <!-- generic call app chips -->
  <g transform="translate(40 120)">
    <rect width="64" height="64" rx="16" fill="#fbf8f1"/>
    <rect x="14" y="22" width="26" height="20" rx="4" fill="#c79e30"/><path d="M40 28l12-7v22l-12-7z" fill="#c79e30"/>
  </g>
  <g transform="translate(40 200)">
    <rect width="64" height="64" rx="16" fill="#fbf8f1"/>
    <rect x="25" y="14" width="14" height="24" rx="7" fill="#4a453e"/>
    <path d="M18 32c0 10 6 16 14 16s14-6 14-16M32 48v6" fill="none" stroke="#4a453e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
