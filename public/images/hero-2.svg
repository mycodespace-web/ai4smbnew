<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Slide 2: time saved by automation (clock, gears, tasks ticking off) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e3d8"/><stop offset="1" stop-color="#d8cfc1"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="770" width="1600" height="130" fill="#c4b7a4"/>
  <!-- big clock -->
  <circle cx="300" cy="330" r="210" fill="#5a544b"/>
  <circle cx="300" cy="330" r="190" fill="#fbf8f1"/>
  <g stroke="#6d665c" stroke-width="8" stroke-linecap="round">
    <path d="M300 160v26M300 474v26M130 330h26M444 330h26"/>
  </g>
  <g stroke="#b5ab9b" stroke-width="5" stroke-linecap="round">
    <path d="M385 183l-10 17M447 245l-17 10M447 415l-17-10M385 477l-10-17M215 477l10-17M153 415l17-10M153 245l17 10M215 183l10 17"/>
  </g>
  <path d="M300 330V220" stroke="#4a453e" stroke-width="12" stroke-linecap="round"/>
  <path d="M300 330l92 52" stroke="#c79e30" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300" cy="330" r="14" fill="#4a453e"/>
  <path d="M300 140a190 190 0 0 1 164 95" fill="none" stroke="#c79e30" stroke-width="14" stroke-linecap="round" opacity=".55"/>
  <!-- gears -->
  <g transform="translate(470 610)">
    <g fill="#c79e30">
      <circle r="70"/>
      <g id="t"><rect x="-14" y="-92" width="28" height="30" rx="4"/></g>
      <use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(135)"/>
      <use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(315)"/>
    </g>
    <circle r="26" fill="#e9e3d8"/>
  </g>
  <g transform="translate(600 690)">
    <g fill="#8a8174">
      <circle r="44"/>
      <g id="t2"><rect x="-10" y="-60" width="20" height="22" rx="3"/></g>
      <use href="#t2" transform="rotate(60)"/><use href="#t2" transform="rotate(120)"/><use href="#t2" transform="rotate(180)"/><use href="#t2" transform="rotate(240)"/><use href="#t2" transform="rotate(300)"/>
    </g>
    <circle r="16" fill="#e9e3d8"/>
  </g>
  <!-- task board -->
  <rect x="1070" y="120" width="440" height="520" rx="14" fill="#fff"/>
  <rect x="1070" y="120" width="440" height="70" rx="14" fill="#4a453e"/>
  <rect x="1070" y="160" width="440" height="30" fill="#4a453e"/>
  <rect x="1100" y="145" width="160" height="18" rx="9" fill="#e3c675"/>
  <g>
    <rect x="1100" y="225" width="380" height="72" rx="10" fill="#f3efe7"/>
    <circle cx="1140" cy="261" r="20" fill="#c79e30"/><path d="M1130 261l8 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1180" y="250" width="210" height="10" rx="5" fill="#b5ab9b"/><rect x="1180" y="268" width="140" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="1100" y="317" width="380" height="72" rx="10" fill="#f3efe7"/>
    <circle cx="1140" cy="353" r="20" fill="#c79e30"/><path d="M1130 353l8 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1180" y="342" width="240" height="10" rx="5" fill="#b5ab9b"/><rect x="1180" y="360" width="160" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="1100" y="409" width="380" height="72" rx="10" fill="#f3efe7"/>
    <circle cx="1140" cy="445" r="20" fill="#c79e30"/><path d="M1130 445l8 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1180" y="434" width="190" height="10" rx="5" fill="#b5ab9b"/><rect x="1180" y="452" width="120" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="1100" y="501" width="380" height="72" rx="10" fill="#f3efe7"/>
    <circle cx="1140" cy="537" r="18" fill="none" stroke="#b5ab9b" stroke-width="4"/>
    <rect x="1180" y="526" width="220" height="10" rx="5" fill="#b5ab9b"/><rect x="1180" y="544" width="130" height="8" rx="4" fill="#d6cfc2"/>
  </g>
  <!-- small robot arm placing a task -->
  <rect x="1300" y="730" width="140" height="40" rx="8" fill="#5a544b"/>
  <path d="M1370 730V640l70-60" fill="none" stroke="#6d665c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1370" cy="640" r="18" fill="#c79e30"/><circle cx="1440" cy="580" r="14" fill="#c79e30"/>
  <path d="M1452 568l22-14M1452 592l22 10" stroke="#4a453e" stroke-width="8" stroke-linecap="round"/>
  <!-- hourglass -->
  <g transform="translate(1180 690)">
    <rect x="-46" y="-6" width="92" height="12" rx="4" fill="#8a7a63"/><rect x="-46" y="70" width="92" height="12" rx="4" fill="#8a7a63"/>
    <path d="M-34 6h68c0 26-28 30-28 32s28 6 28 32h-68c0-26 28-30 28-32S-34 32-34 6z" fill="#fbf8f1" stroke="#b5ab9b" stroke-width="3"/>
    <path d="M-16 66h32c-4-12-12-16-16-18-4 2-12 6-16 18z" fill="#e3c675"/>
  </g>
</svg>
