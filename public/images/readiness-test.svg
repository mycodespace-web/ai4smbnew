  <rect x="90" y="208" width="18" height="18" rx="4" fill="#c79e30"/><path d="M94 217l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="276" width="18" height="18" rx="4" fill="#c79e30"/><path d="M94 285l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e3ddd2"><rect x="120" y="212" width="130" height="10" rx="5"/><rect x="120" y="246" width="100" height="10" rx="5"/><rect x="120" y="280" width="150" height="10" rx="5"/></g>
