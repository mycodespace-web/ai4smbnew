    <circle cx="238" cy="158" r="5" fill="#c79e30"/>
    <g fill="#e3ddd2"><rect x="258" y="119" width="120" height="9" rx="4"/><rect x="258" y="153" width="150" height="9" rx="4"/><rect x="258" y="187" width="110" height="9" rx="4"/><rect x="258" y="221" width="130" height="9" rx="4"/></g>
  </g>
