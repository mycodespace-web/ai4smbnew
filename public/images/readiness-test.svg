    <rect x="324" y="100" width="150" height="10" rx="5" fill="#d6cfc2"/>
    <g fill="#7fb07a"><circle cx="336" cy="140" r="8"/><circle cx="336" cy="172" r="8"/><circle cx="336" cy="204" r="8"/></g>
    <g fill="#e3ddd2"><rect x="354" y="135" width="120" height="9" rx="4"/><rect x="354" y="167" width="100" height="9" rx="4"/><rect x="354" y="199" width="130" height="9" rx="4"/></g>
    <rect x="324" y="300" width="200" height="12" rx="6" fill="#eeece9"/><rect x="324" y="300" width="140" height="12" rx="6" fill="#7fb07a"/>
  </g>
  <g transform="rotate(3 330 260)">
