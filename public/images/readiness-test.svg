  <rect x="60" y="40" width="300" height="400" rx="14" fill="#fff" stroke="#e3ddd2" stroke-width="2"/>
  <rect x="88" y="72" width="70" height="8" rx="4" fill="#c79e30"/>
  <rect x="88" y="92" width="230" height="12" rx="6" fill="#b5ab9b"/>
  <rect x="88" y="112" width="180" height="12" rx="6" fill="#b5ab9b"/>
  <rect x="88" y="146" width="244" height="40" rx="8" fill="#eeece9"/>
