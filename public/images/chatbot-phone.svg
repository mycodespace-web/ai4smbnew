<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440">
  <!-- Hand holding a phone with a chatbot conversation -->
  <g transform="rotate(-12 180 200)">
    <!-- palm and wrist behind the phone -->
    <path d="M78 318c-6-34 22-52 46-38l12 8h110l14-10c26-16 56 6 50 40l-6 46c-4 30-24 52-50 62l6 120H122l4-118c-28-14-44-56-48-110z" fill="#e8c4a0"/>
    <rect x="100" y="30" width="170" height="330" rx="26" fill="#2f2d2a"/>
    <rect x="110" y="44" width="150" height="302" rx="18" fill="#fbf8f1"/>
    <rect x="160" y="52" width="50" height="8" rx="4" fill="#2f2d2a"/>
    <!-- header -->
    <circle cx="132" cy="80" r="10" fill="#c79e30"/>
    <rect x="148" y="74" width="60" height="7" rx="3" fill="#b5ab9b"/>
    <rect x="148" y="85" width="36" height="5" rx="2" fill="#7fb07a"/>
    <!-- messages -->
    <path d="M122 104h98a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8h-88l-14 10 4-12a8 8 0 0 1-8-6v-40a8 8 0 0 1 8-8z" fill="#c79e30"/>
    <g fill="#fff"><rect x="132" y="116" width="80" height="6" rx="3"/><rect x="132" y="128" width="70" height="6" rx="3"/><rect x="132" y="140" width="50" height="6" rx="3"/></g>
    <path d="M170 182h72a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8h-72a8 8 0 0 1-8-8v-20a8 8 0 0 1 8-8z" fill="#eeece9"/>
    <g fill="#8a8174"><rect x="176" y="194" width="60" height="6" rx="3"/></g>
    <path d="M122 232h104a8 8 0 0 1 8 8v52a8 8 0 0 1-8 8h-104a8 8 0 0 1-8-8v-52a8 8 0 0 1 8-8z" fill="#c79e30"/>
    <g fill="#fff"><rect x="132" y="244" width="84" height="6" rx="3"/><rect x="132" y="256" width="76" height="6" rx="3"/><rect x="132" y="268" width="84" height="6" rx="3"/><rect x="132" y="280" width="40" height="6" rx="3"/></g>
    <!-- typing indicator -->
    <rect x="178" y="312" width="56" height="20" rx="10" fill="#eeece9"/>
    <g fill="#b5ab9b"><circle cx="192" cy="322" r="3.5"/><circle cx="206" cy="322" r="3.5"/><circle cx="220" cy="322" r="3.5"/></g>
    <!-- thumb on the left edge -->
    <path d="M84 344c-10-30-6-62 10-84 8-10 22-8 22 6l-2 82c-8 12-22 10-30-4z" fill="#edcaa8"/>
    <path d="M98 270c4-4 10-4 12 2" stroke="#d4a57f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- fingertips wrapping the right edge -->
    <g fill="#edcaa8">
      <rect x="258" y="196" width="40" height="30" rx="15"/>
      <rect x="258" y="236" width="44" height="32" rx="16"/>
      <rect x="258" y="278" width="42" height="32" rx="16"/>
      <rect x="258" y="320" width="36" height="28" rx="14"/>
    </g>
    <g stroke="#d4a57f" stroke-width="2.5" stroke-linecap="round"><path d="M262 211h8M262 252h8M262 294h8M262 334h8"/></g>
  </g>
</svg>
